<html>
<head>
    <title>Plagiarism Report</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #1e1e2f;
            color: #ffffff;
            line-height: 1.8;
            padding: 20px;
            text-align: center;
        }
        h1 {
            text-align: center;
            background: linear-gradient(90deg, #ff6b6b, #556270);
            -webkit-background-clip: text;
            color: transparent;
            font-size: 3em;
        }
        h2 {
            color: #ffa502;
        }
        #plagiarism-percent {
            font-weight: bold;
            color: #ff4757;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            background: #2f3542;
            margin: 10px 0;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
        }
        li:hover {
            transform: scale(1.02);
        }
        a {
            color: #70a1ff;
            text-decoration: none;
            font-weight: bold;
        }
        a:hover {
            text-decoration: underline;
            color: #ff6b81;
        }
        .match-item {
            margin-top: 15px;
            padding: 12px;
            background: #57606f;
            border-left: 6px solid #ffa502;
            border-radius: 8px;
            transition: background 0.3s ease;
        }
        .match-item:hover {
            background: #747d8c;
        }
        .score {
            color: #2ed573;
            font-weight: bold;
        }
        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 1.2em;
            text-align: center;
        }
        .alert-danger {
            background-color: #ff4757;
            color: white;
        }
        .btn-home {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            font-size: 1.2em;
            background: linear-gradient(90deg, #70a1ff, #1e90ff);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
            text-decoration: none;
        }
        .btn-home:hover {
            background: linear-gradient(90deg, #1e90ff, #70a1ff);
        }
    </style>
</head>
<body>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <h1>Plagiarism Report</h1>

    <h2>Overall Plagiarism: <span id="plagiarism-percent"></span>%</h2>

    <h2>Matched Sources</h2>
    <ul id="matched-sources"></ul>

    <h2>Citations</h2>
    <ul id="citations"></ul>

    <a href="/" class="btn-home">Return to Home Page</a>

    <script>
        const data = {{ matched_texts|tojson|safe }};
        const plagper = {{ similarity|tojson|safe }};
        console.log(data)
        console.log(plagper)

        document.getElementById('plagiarism-percent').textContent = data.percentPlagiarism;

        const sourcesContainer = document.getElementById('matched-sources');
        const citationsContainer = document.getElementById('citations');

        data.sources.forEach(source => {
            const li = document.createElement('li');
            const anchor = document.createElement('a');
            anchor.href = source.url;
            anchor.target = '_blank';
            anchor.textContent = source.title;

            const subList = document.createElement('ul');
            source.matches.forEach(match => {
                const matchItem = document.createElement('li');
                matchItem.className = 'match-item';
                matchItem.innerHTML = `
                    <strong>Match:</strong> "${match.matchText}"<br>
                    <strong>Context:</strong> "${match.context.before}...${match.context.after}"<br>
                    <strong>Score:</strong> <span class="score">${match.score}</span>
                `;
                subList.appendChild(matchItem);
            });

            li.appendChild(anchor);
            li.appendChild(subList);
            sourcesContainer.appendChild(li);
        });

        data.citations.forEach(citation => {
            const li = document.createElement('li');
            const anchor = document.createElement('a');
            anchor.href = citation.url;
            anchor.target = '_blank';
            anchor.textContent = citation.title;

            li.innerHTML = `
                <strong>Title:</strong> 
            `;
            li.insertBefore(anchor, li.firstChild);
            li.innerHTML += `<br><strong>Score:</strong> <span class="score">${citation.score}</span>`;

            citationsContainer.appendChild(li);
        });
    </script>
</body>
</html>
